# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: My Journal
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: priyadharshan0903.github.io/Journal
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # Temporarily hide the platform roadmap. Remove this entry to publish it again.
    - "Platform Engineer Roadmap - Golang.md"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Blueprint: condensed uppercase headings, tracked-out mono metadata.
    # Keep this block in sync with the `quartz-fonts` plugin's own `options`
    # below — that plugin does not read this typography block at all.
    typography:
      header:
        name: Barlow Condensed
        weights: [400, 600]
      body:
        name: Barlow
        weights: [400, 500, 700]
      code:
        name: IBM Plex Mono
        weights: [400, 500]
    colors:
      # Blueprint: dark, technical/industrial. Light mode derives from the
      # design's own un-darkened tokens rather than the dark palette, so hover
      # goes darker in light mode and lighter in dark mode — same convention
      # the previous sandalwood theme used.
      lightMode:
        light: "#f2f2f3" # paper
        lightgray: "#dcdcdd" # borders, rules
        gray: "#5d5d60" # muted text, graph links
        darkgray: "#33353a" # body text
        dark: "#1a1c1d" # headings
        secondary: "#5980a6" # links, accent
        tertiary: "#597ea3" # hover — darker in light mode
        highlight: rgba(89, 128, 166, 0.1)
        textHighlight: "#b5d9fd88"
      darkMode:
        light: "#111315" # near-black, blue-tinted
        lightgray: "#292c2f" # hairline borders
        gray: "#8a8d90" # muted text, graph links
        darkgray: "#cfd0d2" # body text
        dark: "#e8e9ea" # headings
        secondary: "#94bce3" # links, accent
        tertiary: "#b5d9fd" # hover — lighter in dark mode
        highlight: rgba(148, 188, 227, 0.12)
        textHighlight: "#94bce366"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    # This plugin does NOT read configuration.theme.typography — it has its own
    # font options and silently falls back to Quartz's stock faces otherwise.
    # Keep these in sync with theme.typography above or two different font sets
    # get requested.
    options:
      fontOrigin: googleFonts
      header:
        name: Barlow Condensed
        weights: [400, 600]
      body:
        name: Barlow
        weights: [400, 500, 700]
      code:
        name: IBM Plex Mono
        weights: [400, 500]
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # Only needed for a custom domain. On a github.io project page a CNAME file
  # makes Pages try to serve from a domain that isn't configured.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
    options:
      showFolderCount: true
      showSubfolders: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # Blueprint page-type/component plugins.
  - source: "./quartz/plugins/directories"
    enabled: true
    order: 15
  - source: "./quartz/plugins/tag-directory"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
  - source: "./quartz/plugins/note-siblings"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "./quartz/plugins/recap"
    enabled: true
    layout:
      position: right
      priority: 40
  # Blueprint has no persistent file-tree sidebar — a note's left rail is a
  # folder-scoped sibling list (note-siblings) instead.
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  # Local graph panel moves back into the note's right rail; the dedicated
  # /graph page renders its own always-expanded instance independently.
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
      groupOptions:
        grow: true
  # Restyled into the full-width "Linked notes" grid under the article.
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: afterBody
      priority: 30
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # Date and read-time are noise on the landing page.
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # Site wordmark leads the top nav.
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 40
      group: toolbar
  # Not in the Blueprint design.
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: header
      priority: 50
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/Priyadharshan0903
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  # Follows the toolbar into the header; left rail is now explorer-only.
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: header
      priority: 20
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
      # The landing page's frontmatter is metadata, not content to show.
      condition: not-index
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        left: []
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        left: []
        right: []
    # Homepage / graph / folders-hub / notes-index — each Body owns its full
    # layout (hero, mini graph, stats rail, etc.), so no generic chrome.
    directories:
      positions:
        beforeBody: []
        afterBody: []
        left: []
        right: []
    canvas: {}
    bases: {}
